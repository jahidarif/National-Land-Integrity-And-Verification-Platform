[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "national-land-integrity-chatbot-backend"
version = "0.2.0"
description = "National Land Integrity chatbot API with optional Maira and speech-to-text adapters"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "gunicorn>=23,<24",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic[email]>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pyjwt>=2.10,<3",
  "bcrypt>=4.2,<5",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "boto3>=1.35,<2",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1", "pytest-cov>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["app"]
